name: Preprocess Employee Attrition Dataset

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pwd
          ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r preprocessing/requirements.txt

      - name: Run automated preprocessing
        run: |
          python preprocessing/automate_Panji.py --raw-path employee_attrition_raw/employee_attrition_raw.csv --output-dir preprocessing/employee_attrition_preprocessing

      - name: Upload preprocessed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-attrition-preprocessed
          path: preprocessing/employee_attrition_preprocessing

      - name: Commit refreshed preprocessed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocessing/employee_attrition_preprocessing
          git diff --cached --quiet || git commit -m "Refresh preprocessed employee attrition dataset"
          git push
